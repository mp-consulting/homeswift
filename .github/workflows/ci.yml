name: CI

# Tests every push to main and every pull request, on macOS and Linux.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the Swift jobs run: a pull request that changes only docs, the website or Markdown skips them. A skipped job
  # passes a required check; pushes to main always run them.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      swift: ${{ steps.files.outputs.swift }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo swift=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files" --jq '.[].filename') || { echo swift=true >> "$GITHUB_OUTPUT"; exit 0; }
          other=$(printf '%s\n' "$files" | grep -vE '^(site/|docs/|Benchmarks/|\.github/ISSUE_TEMPLATE/|[^/]+\.md$|Plugins/[^/]+/README\.md$)' || true)
          if [ -n "$other" ]; then echo swift=true >> "$GITHUB_OUTPUT"; else echo swift=false >> "$GITHUB_OUTPUT"; echo "Only docs and the website changed: the Swift jobs are skipped"; fi

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check website translations, version and design system
        run: |
          node Scripts/site-languages.mjs --check
          node Scripts/site-version.mjs --check
          node Scripts/design-system.mjs --check
      - name: Check browser control regressions
        run: |
          node Scripts/test-reconnect.mjs
          node Scripts/test-accessory-groups.mjs

      - name: Check test runner ordering and history
        run: |
          python3 Scripts/test-test-runner.py
          python3 Scripts/test-split-build-cache.py

  macos:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history without file contents, for Scripts/restore-mtimes.swift.
          fetch-depth: 0
          filter: blob:none

      - name: Use the newest Xcode on the runner
        # The image's default can lag behind; local builds use the current Xcode, so CI should too.
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Date the files by their last commit
        # A checkout dates every file now, which would rebuild all of the package's own code over the cached build.
        run: swift Scripts/restore-mtimes.swift

      - name: Key the build cache
        # Builds reuse the last one's .build: the dependencies (two BoringSSLs, swift-nio) and what did not change.
        # Include architecture and toolchain/SDK identity. Main saves per commit; PRs reuse
        # their first successful cache to avoid uploading the whole build on every revision.
        id: build-key
        run: |
          toolchain=$({ swift --version; xcodebuild -version; xcrun --show-sdk-version; } 2>&1 | cksum | cut -d' ' -f1)
          echo "key=build-v2-${{ runner.os }}-${{ runner.arch }}-$toolchain-${{ hashFiles('Package.resolved') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the build
        id: restore-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.build-key.outputs.key }}-${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || github.sha }}
          restore-keys: ${{ steps.build-key.outputs.key }}-

      - name: Rebuild the targets changed since the cached build
        # Over a pull request's own cache too: once its branch merges main, main's changes are newer than that build.
        # The script compares the checkout with the commit the restored build was made from (.build/.built-from).
        run: Scripts/forget-changed-targets.sh
        env:
          CACHE_KEY: ${{ steps.restore-build.outputs.cache-matched-key }}

      - name: Test
        # A bounded pool of test bundles (Scripts/test.sh); a watchdog prints the test processes' stacks and fails when the
        # tests stall, rather than waiting for the job.
        timeout-minutes: 25
        run: Scripts/ci-test.sh

      - name: Check batch generation preserves committed assets
        run: |
          swift Scripts/embed-assets.swift all
          git diff --exit-code -- Sources Plugins
          test -z "$(git ls-files --others --exclude-standard -- Sources Plugins)"

      - name: Restart
        # Restart.swift on its own (the CLI's tests cannot exec): the deadline, and no descriptor kept across the exec.
        run: swiftc -parse-as-library -o "$RUNNER_TEMP/test-restart" Sources/HomeswiftCLI/Restart.swift Scripts/test-restart.swift && "$RUNNER_TEMP/test-restart"

      - name: Build
        # On main only: a pull request's release build is Linux's, and macOS's queue is what holds a merge up.
        if: github.event_name == 'push'
        run: swift build -c release

      - name: Record the commit the build is made from
        # Keep the reachable PR head for comparisons; an older synthetic merge commit may not be fetched.
        if: ${{ success() && steps.restore-build.outputs.cache-hit != 'true' }}
        run: git rev-parse --verify --quiet HEAD^2 > .build/.built-from || git rev-parse HEAD > .build/.built-from

      - name: Save the build
        if: ${{ success() && steps.restore-build.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.restore-build.outputs.cache-primary-key }}

  linux:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history without file contents, for Scripts/restore-mtimes.swift.
          fetch-depth: 0
          filter: blob:none

      - name: Install Avahi's dns_sd
        # From Azure's Ubuntu mirror, as the runner itself: from GitHub's containers, Ubuntu's own names have failed to resolve.
        run: |
          sed -i -E -e 's#http://(archive|security)\.ubuntu\.com#http://azure.archive.ubuntu.com#' \
            -e 's#http://ports\.ubuntu\.com#http://azure.ports.ubuntu.com#' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update && apt-get install -y --no-install-recommends libavahi-compat-libdnssd-dev python3

      - name: Date the files by their last commit
        # A checkout dates every file now, which would rebuild all of the package's own code over the cached build.
        run: |
          git config --global --add safe.directory "$PWD"
          swift Scripts/restore-mtimes.swift

      - name: Key the build cache
        # Cache the exact dependency generation separately from the changing project outputs.
        # Compiler, manifest and partition-format changes invalidate both layers.
        # Keep existing refresh policy: main per commit, PR first successful build.
        id: build-key
        run: |
          toolchain=$({ swift --version; cat /etc/os-release; cc --version; } 2>&1 | cksum | cut -d' ' -f1)
          echo "key=split-build-v1-${{ runner.os }}-${{ runner.arch }}-$toolchain-${{ hashFiles('Package.resolved', 'Package.swift', 'Scripts/build.sh', 'Scripts/test.sh', 'Scripts/ci-test.sh', 'Scripts/split-build-cache.py') }}" >> "$GITHUB_OUTPUT"

      - name: Restore project build outputs
        id: restore-project
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-build-cache/project
          key: ${{ steps.build-key.outputs.key }}-project-${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || github.sha }}
          restore-keys: ${{ steps.build-key.outputs.key }}-project-

      - name: Select the matching dependency generation
        id: dependency-key
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          metadata = Path('.ci-build-cache/project/.homeswift-cache-metadata.json')
          digest = json.loads(metadata.read_text())['dependency_digest'] if metadata.exists() else 'lookup'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('digest=' + digest, file=output)
          PYTHON

      - name: Restore dependency build outputs
        id: restore-dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-build-cache/dependencies
          key: ${{ steps.build-key.outputs.key }}-deps-${{ steps.dependency-key.outputs.digest }}
          # A project cache must get its exact generation. Only a project miss may use any compatible dependency cache.
          restore-keys: ${{ steps.dependency-key.outputs.digest == 'lookup' && format('{0}-deps-', steps.build-key.outputs.key) || '' }}

      - name: Reassemble the build cache
        run: python3 Scripts/split-build-cache.py restore

      - name: Rebuild the targets changed since the cached build
        # Over a pull request's own cache too: once its branch merges main, main's changes are newer than that build.
        # The script compares the checkout with the commit the restored build was made from (.build/.built-from).
        run: Scripts/forget-changed-targets.sh
        env:
          CACHE_KEY: ${{ steps.restore-project.outputs.cache-matched-key }}

      - name: Test
        timeout-minutes: 25
        run: Scripts/ci-test.sh

      - name: Restart
        # Restart.swift on its own (the CLI's tests cannot exec): the deadline, and no descriptor kept across the exec.
        run: swiftc -parse-as-library -o "$RUNNER_TEMP/test-restart" Sources/HomeswiftCLI/Restart.swift Scripts/test-restart.swift && "$RUNNER_TEMP/test-restart"

      - name: Build
        run: swift build -c release

      - name: Record the commit the build is made from
        # Keep the reachable PR head for comparisons; an older synthetic merge commit may not be fetched.
        if: ${{ success() && steps.restore-project.outputs.cache-hit != 'true' }}
        run: git rev-parse --verify --quiet HEAD^2 > .build/.built-from || git rev-parse HEAD > .build/.built-from

      - name: Partition the build cache
        id: partition
        if: ${{ success() && steps.restore-project.outputs.cache-hit != 'true' }}
        run: |
          python3 Scripts/split-build-cache.py split > "$RUNNER_TEMP/cache-partition.json"
          cat "$RUNNER_TEMP/cache-partition.json"
          python3 -c 'import json; print("digest=" + json.load(open(".ci-build-cache/project/.homeswift-cache-metadata.json"))["dependency_digest"])' >> "$GITHUB_OUTPUT"

      - name: Save changed dependency outputs
        if: ${{ success() && steps.partition.outcome == 'success' && steps.restore-dependencies.outputs.cache-matched-key != format('{0}-deps-{1}', steps.build-key.outputs.key, steps.partition.outputs.digest) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-build-cache/dependencies
          key: ${{ steps.build-key.outputs.key }}-deps-${{ steps.partition.outputs.digest }}

      - name: Save project outputs
        if: ${{ success() && steps.partition.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-build-cache/project
          key: ${{ steps.restore-project.outputs.cache-primary-key }}

      - name: Restore staged build outputs
        if: ${{ always() && steps.partition.outcome == 'success' }}
        run: python3 Scripts/split-build-cache.py restore

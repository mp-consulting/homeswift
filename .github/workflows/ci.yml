name: CI

# Tests every push to main and every pull request, on macOS and Linux.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Use the newest Xcode on the runner
        # The image's default can lag behind; local builds use the current Xcode, so CI should too.
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Test
        # A watchdog prints the test process's stacks and fails when the tests stall, rather than waiting for the job.
        timeout-minutes: 25
        run: Scripts/ci-test.sh

      - name: Build
        run: swift build -c release

  linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Avahi's dns_sd
        run: apt-get update && apt-get install -y --no-install-recommends libavahi-compat-libdnssd-dev

      - name: Test
        timeout-minutes: 25
        run: Scripts/ci-test.sh

      - name: Build
        run: swift build -c release

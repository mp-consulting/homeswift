name: Pages

# Publishes site/ (the homeswift.dev website, plain HTML) to GitHub Pages when it changes on main. The repository's
# Pages source must be "GitHub Actions"; site/CNAME names the custom domain.
on:
  push:
    branches: [main]
    paths: ["site/**", "Scripts/site-languages.mjs", "Scripts/design-system.mjs", "Sources/HomeswiftUI/Web/**", "Sources/Homeswift/Model/Definitions.swift", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # fr/, es/ and pt/index.html are generated from index.html and the catalogs: a stale copy stops the deploy.
      - name: Check the translated home pages
        run: node Scripts/site-languages.mjs --check

      - name: Check the design system catalog and production controls
        run: node Scripts/design-system.mjs --check

      # Cloudflare, in front of Pages, keeps stylesheets and scripts for 4 hours and fetches HTML every time: a deploy
      # would pair new pages with the previous deploy's site.css and site.js. Each page's own .css and .js addresses
      # get the commit as a query, so every deploy asks for files no cache has seen (i18n.js passes its query on to
      # the catalog it loads). The repository stays plain HTML.
      - name: Version the pages' stylesheet and script addresses
        run: find site -name '*.html' -exec sed -E -i "s#(href|src)=\"([^\":?]+\.(css|js))\"#\1=\"\2?v=${GITHUB_SHA::8}\"#g" {} +

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

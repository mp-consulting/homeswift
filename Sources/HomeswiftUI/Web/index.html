<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e2bba5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#231c19" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Homeswift">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Homeswift</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<script src="/i18n.js"></script>
</head>
<body>
<div id="auth" class="auth hidden">
  <form id="auth-form" class="card">
    <img src="/icon.svg" class="logo large" alt="">
    <h1>Homeswift</h1>
    <p id="auth-text"></p>
    <label data-i18n>Username <input name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
    <label data-i18n>Password <input name="password" type="password" autocomplete="current-password" required minlength="1"></label>
    <label id="auth-otp" class="hidden" data-i18n>Code from your authenticator app <input name="otp" inputmode="numeric" autocomplete="one-time-code" spellcheck="false" placeholder="123 456" maxlength="9"></label>
    <label id="auth-setup-code" class="hidden" data-i18n>Set-up code <input name="setupCode" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX"></label>
    <p class="error" id="auth-error"></p>
    <button type="submit" id="auth-submit" class="primary" data-i18n>Sign in</button>
  </form>
</div>
<div id="app" class="hidden">
  <header>
    <a class="brand" href="/" aria-label="Homeswift" title="Homeswift"><img src="/icon.svg" class="logo" alt=""><span class="brand-name" aria-hidden="true">Homeswift</span></a>
    <span class="side-caption" aria-hidden="true" data-i18n>Home</span>
    <nav>
      <a href="/status" data-i18n>Status</a>
      <a href="/accessories" data-i18n>Accessories</a>
      <a href="/scenes" data-i18n>Scenes</a>
      <a href="/plugins" data-i18n>Plugins</a>
      <a href="/logs" data-i18n>Logs</a>
      <a href="/settings" data-i18n>Settings</a>
    </nav>
    <span class="side-caption" aria-hidden="true" data-i18n>You</span>
    <nav class="side-you">
      <a href="/account" data-i18n>Account</a>
      <a href="/appearance" data-i18n>Appearance</a>
    </nav>
    <span class="spacer"></span>
    <button id="user" type="button" class="user-button" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu" data-i18n><span class="user-avatar" aria-hidden="true"></span><span class="user-text"><span class="user-name"></span><span class="user-role"></span></span><span class="user-chevron" aria-hidden="true"></span></button>
  </header>
  <div id="banner" class="banner hidden" data-i18n>Some changes need a restart of homeswift. <button id="restart" class="link" data-i18n data-action-icon="power">Restart now</button></div>
  <main id="view"></main>
</div>
<script src="/common.js"></script>
<script src="/remote.js"></script>
<script src="/camera.js"></script>
<script src="/widgets.js"></script>
<script src="/groups.js"></script>
<script src="/charts.js"></script>
<script src="/chat.js"></script>
<script src="/home.js"></script>
<script src="/admin.js"></script>
<script src="/import.js"></script>
<script src="/app.js"></script>
</body>
</html>
